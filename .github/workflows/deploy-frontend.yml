name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DotnetNiger.UI/DotnetNiger.UI.csproj

      - name: Inject production config
        run: |
          cat > DotnetNiger.UI/wwwroot/appsettings.Production.json << 'EOF'
          {
            "ApiBaseUrl": "http://dotnetnigerdeploytest.runasp.net",
            "UseMockServices": false,
            "ClientId": "web-ui"
          }
          EOF
          sed -i 's|<base href="/" />|<base href="/DotnetNiger/" />|' DotnetNiger.UI/wwwroot/index.html

      - name: Publish
        run: dotnet publish DotnetNiger.UI/DotnetNiger.UI.csproj -c Release -o publish

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
