name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monsterasp
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore DotnetNiger.Api/DotnetNiger.Api.csproj

      - name: Build
        run: dotnet build DotnetNiger.Api/DotnetNiger.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish DotnetNiger.Api/DotnetNiger.Api.csproj -c Release -o ./publish --no-restore

      - name: Generate appsettings.Production.json
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          MONSTERASP_URL: ${{ secrets.MONSTERASP_URL }}
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os

          def opt(d, key, env, transform=str):
              v = os.environ.get(env, "")
              if v:
                  d[key] = transform(v)

          def opt_int(d, key, env):
              v = os.environ.get(env, "")
              if v:
                  d[key] = int(v)

          cfg = {
              "DatabaseProvider": "SqlServer",
              "ConnectionStrings": {
                  "DefaultConnection": os.environ.get("DB_CONNECTION", "")
              },
              "Jwt": {
                  "SecretKey": os.environ.get("JWT_SECRET_KEY", ""),
                  "Issuer": "DotnetNiger",
                  "Audience": "DotnetNigerWebUI",
                  "AccessTokenExpirationMinutes": 60,
                  "RefreshTokenExpirationDays": 7
              }
          }

          auth = {}
          google = {}
          opt(google, "ClientId", "GOOGLE_CLIENT_ID")
          opt(google, "ClientSecret", "GOOGLE_CLIENT_SECRET")
          if google:
              auth["Google"] = google

          github = {}
          opt(github, "ClientId", "GITHUB_CLIENT_ID")
          opt(github, "ClientSecret", "GITHUB_CLIENT_SECRET")
          if github:
              auth["GitHub"] = github

          if auth:
              cfg["Authentication"] = auth

          smtp = {}
          opt(smtp, "Host", "SMTP_HOST")
          opt_int(smtp, "Port", "SMTP_PORT")
          opt(smtp, "Username", "SMTP_USERNAME")
          opt(smtp, "Password", "SMTP_PASSWORD")
          opt(smtp, "FromEmail", "SMTP_FROM_EMAIL")
          opt(smtp, "FromName", "SMTP_FROM_NAME")
          if smtp:
              cfg["Smtp"] = smtp

          opt(cfg, "FrontendBaseUrl", "FRONTEND_BASE_URL")

          origins = os.environ.get("CORS_ORIGINS", "")
          if origins:
              cfg["Cors"] = {"AllowedOrigins": origins}

          admin_pw = os.environ.get("ADMIN_DEFAULT_PASSWORD", "")
          if admin_pw:
              cfg["Admin"] = {"DefaultPassword": admin_pw}

          with open("./publish/appsettings.Production.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          print("appsettings.Production.json generated.")
          PY

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Take application offline
        env:
          SFTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          SFTP_DIR: ${{ secrets.MONSTERASP_FTP_DIR || '/wwwroot' }}
        run: |
          cat > ./app_offline.htm <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Deploying...</title></head>
          <body style="display:grid;place-items:center;min-height:100vh;font-family:system-ui;margin:0;background:#07080d;color:#e7e9f0;">
          <div style="text-align:center;padding:2rem;">
          <h1>Deploying...</h1>
          <p>DotnetNiger API is briefly offline. Refresh in a few seconds.</p>
          </div></body></html>
          HTML
          lftp -c "set sftp:auto-confirm yes; \
            open -u $SFTP_USER,$SFTP_PASSWORD sftp://$SFTP_HOST:22; \
            put -O $SFTP_DIR ./app_offline.htm"
          sleep 5

      - name: Deploy via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          SFTP_DIR: ${{ secrets.MONSTERASP_FTP_DIR || '/wwwroot' }}
        run: |
          cd ./publish
          lftp -c "set sftp:auto-confirm yes; \
            set mirror:set-permissions no; \
            open -u $SFTP_USER,$SFTP_PASSWORD sftp://$SFTP_HOST:22; \
            mirror -R --transfer-all --verbose --exclude-glob app_offline.htm . $SFTP_DIR"

      - name: Bring application online
        if: always()
        env:
          SFTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          SFTP_DIR: ${{ secrets.MONSTERASP_FTP_DIR || '/wwwroot' }}
        run: |
          lftp -c "set sftp:auto-confirm yes; \
            open -u $SFTP_USER,$SFTP_PASSWORD sftp://$SFTP_HOST:22; \
            rm -f $SFTP_DIR/app_offline.htm"
