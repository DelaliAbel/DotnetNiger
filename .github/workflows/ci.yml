name: CI

# La suite de tests tourne à chaque envoi et à chaque proposition de fusion.
# Le but est de voir une régression sur la branche, pas après la fusion.
on:
  push:
    branches: ["**"]
  pull_request:

# Un envoi qui en remplace un autre annule la construction devenue inutile : sur une
# branche active, seule la dernière version compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Le README fixe /usr/lib/dotnet/dotnet pour le poste local. En intégration continue,
  # `dotnet` vient de setup-dotnet et se trouve sur le PATH : on ne fige donc pas le chemin.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # global.json épingle 10.0.110 avec rollForward latestFeature : le préfixe de
          # bande suffit, et une révision plus récente du même bande reste acceptée.
          dotnet-version: "10.0.x"

      # Le thème compilé est versionné, mais la cible MSBuild `TailwindBuildCss` le
      # recompile dès que node_modules est présent. Sans Node, elle publie le CSS tel
      # qu'il est versionné ; avec Node, le CSS produit ici est celui que le site reçoit.
      # On installe donc Node pour compiler exactement comme en production.
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances front
        run: npm ci

      - name: Compiler le thème
        run: npm run css:minify

      - name: Restaurer les paquets .NET
        run: dotnet restore DotnetNiger.slnx

      # TreatWarningsAsErrors est actif dans Directory.Build.props : une compilation
      # propre ici vaut donc contrôle de qualité, pas seulement contrôle de syntaxe.
      - name: Compiler
        run: dotnet build DotnetNiger.slnx --no-restore --configuration Release

      - name: Exécuter les tests
        run: >-
          dotnet test DotnetNiger.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=resultats.trx"
          --collect "XPlat Code Coverage"
          --results-directory artifacts/tests

      # Le rapport de tests reste consultable même quand tout est vert, et surtout
      # quand ce ne l'est pas : c'est là qu'on lit quel cas a échoué.
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: artifacts/tests
          if-no-files-found: ignore
          retention-days: 7
