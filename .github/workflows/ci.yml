name: CI

on:
  push:
    branches: ["BackEnd"]
  pull_request:
    branches: ["BackEnd"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DotnetNiger.sln

      - name: Build
        run: dotnet build DotnetNiger.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true
