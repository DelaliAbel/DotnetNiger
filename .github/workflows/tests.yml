name: Tests & Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  architecture-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore architecture tests
        run: dotnet restore DotnetNiger.Tests/DotnetNiger.Architecture.Tests/DotnetNiger.Architecture.Tests.csproj

      - name: Run architecture guard tests
        run: dotnet test DotnetNiger.Tests/DotnetNiger.Architecture.Tests/DotnetNiger.Architecture.Tests.csproj --no-restore --configuration Release --verbosity normal

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore DotnetNiger.slnx

      - name: Build
        run: dotnet build DotnetNiger.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DotnetNiger.slnx --no-build --verbosity normal --configuration Release

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore DotnetNiger.slnx

      - name: Check for errors and warnings
        run: dotnet build DotnetNiger.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true
