services:
  gateway:
    build:
      context: .
      dockerfile: DotnetNiger.Gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Jwt__Issuer=${JWT_ISSUER:-DotnetNiger.Identity}
      - Jwt__Audience=${JWT_AUDIENCE:-DotnetNiger.Identity.Client}
      - Gateway__BaseUrl=${PUBLIC_URL:-http://localhost:5000}
      - DeveloperPortal__IdentityBaseUrl=${PUBLIC_URL:-http://localhost:5000}/identity-api
      - DeveloperPortal__InternalApiKey=${INTERNAL_API_KEY:-}
      - DeveloperPortal__HealthCheckIntervalSeconds=${HEALTH_CHECK_INTERVAL:-30}
      - DeveloperPortal__MaxHealthCheckFailures=${HEALTH_CHECK_MAX_FAILURES:-3}
      - ServiceDiscovery__Provider=Static
    depends_on:
      identity:
        condition: service_started
      community:
        condition: service_started
    networks:
      - dotnetniger
    restart: unless-stopped

  identity:
    build:
      context: .
      dockerfile: DotnetNiger.Identity/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__DefaultConnection=Data Source=data/identity.db
      - DatabaseProvider=Sqlite
      - OpenIddict__Issuer=${PUBLIC_URL:-http://localhost:5000}/identity-api
      - Smtp__AppBaseUrl=${PUBLIC_URL:-http://localhost:5000}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-noreply@dotnetniger.com}
      - Smtp__SupportEmail=${SMTP_SUPPORT_EMAIL:-}
      - Gateway__RegistrationUrl=http://gateway:5000/api/service-registry/register
      - Gateway__RegistrationKey=${GATEWAY_REGISTRATION_KEY:-}
      - InternalApiKey=${INTERNAL_API_KEY:-}
      - Admin__DefaultPassword=${ADMIN_PASSWORD:-Admin@123456}
      - RateLimiting__PermitLimit=${RATE_LIMIT_PERMIT:-5}
      - RateLimiting__WindowSeconds=${RATE_LIMIT_WINDOW:-60}
    volumes:
      - identity_data:/app/data
    networks:
      - dotnetniger
    restart: unless-stopped

  community:
    build:
      context: .
      dockerfile: DotnetNiger.Community/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__DefaultConnection=Data Source=data/community.db
      - DatabaseProvider=Sqlite
      - Jwt__Authority=${PUBLIC_URL:-http://localhost:5000}/identity-api
      - Jwt__Issuer=${PUBLIC_URL:-http://localhost:5000}/identity-api/
      - Jwt__Audience=${JWT_AUDIENCE:-DotnetNiger.Identity.Client}
      - Jwt__MetadataAddress=${PUBLIC_URL:-http://localhost:5000}/identity-api/.well-known/openid-configuration
      - Gateway__RegistrationUrl=http://gateway:5000/api/service-registry/register
      - Gateway__RegistrationKey=${GATEWAY_REGISTRATION_KEY:-}
    volumes:
      - community_data:/app/data
    depends_on:
      identity:
        condition: service_started
    networks:
      - dotnetniger
    restart: unless-stopped

  identity-web:
    build:
      context: .
      dockerfile: DotnetNiger.Identity.Web/Dockerfile
    ports:
      - "${IDENTITY_WEB_PORT:-5100}:5100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5100
      - Identity__BaseUrl=${PUBLIC_URL:-http://localhost:5000}/identity-api
      - Identity__ClientId=${IDENTITY_WEB_CLIENT_ID:-web-ui}
      - Identity__ClientSecret=${IDENTITY_WEB_CLIENT_SECRET:-}
      - DeveloperPortal__GatewayBaseUrl=${PUBLIC_URL:-http://localhost:5000}
    depends_on:
      gateway:
        condition: service_started
    networks:
      - dotnetniger
    restart: unless-stopped

networks:
  dotnetniger:
    driver: bridge

volumes:
  identity_data:
  community_data:
