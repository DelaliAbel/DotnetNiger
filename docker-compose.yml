services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnetniger-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "SqlServer2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity:
    build:
      context: .
      dockerfile: DotnetNiger.Identity/Dockerfile
    container_name: dotnetniger-identity
    ports:
      - "5075:5075"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DotnetNiger;User Id=SA;Password=SqlServer2026!;TrustServerCertificate=True;"
      OpenIddict__DisableTransportSecurityRequirement: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  community:
    build:
      context: .
      dockerfile: DotnetNiger.Community/Dockerfile
    container_name: dotnetniger-community
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DotnetNiger;User Id=SA;Password=SqlServer2026!;TrustServerCertificate=True;"
      Identity__BaseUrl: "http://identity:5075"
      Identity__ApiKey: "1376bae7740d46856b92679a5dbd2dab5d754a2507f9d8932b6f4765672c2e7f"
    depends_on:
      sqlserver:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: DotnetNiger.Gateway/Dockerfile
    container_name: dotnetniger-gateway
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DownstreamServices__Identity__DevUrl: "http://identity:5075"
      DownstreamServices__Community__DevUrl: "http://community:5050"
    depends_on:
      - identity
      - community

  identity-web:
    build:
      context: .
      dockerfile: DotnetNiger.Identity.Web/Dockerfile
    container_name: dotnetniger-identity-web
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - identity

volumes:
  sqlserver-data:
