version: "3.8"

services:
  # API Gateway (port 5500)
  gateway:
    build:
      context: .
      dockerfile: DotnetNiger.Gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DownstreamServices__Identity__HealthUrl=http://identity:8081/api/v1/diagnostics/health
      - DownstreamServices__Identity__SwaggerUrl=http://identity:8081/swagger/v1/swagger.json
      - DownstreamServices__Community__HealthUrl=http://community:8082/api/v1/test/health
      - DownstreamServices__Community__SwaggerUrl=http://community:8082/swagger/v1/swagger.json
    depends_on:
      - identity
      - community
    networks:
      - dotnetniger
