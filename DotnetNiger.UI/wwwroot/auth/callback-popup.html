<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Connexion...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; background: #f9fafb; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #7c3aed; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <p>Finalisation de la connexion...</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var errorDesc = params.get('error_description');

      if (code) {
        window.opener.postMessage(
          { type: 'oauth-callback', code: code },
          window.location.origin
        );
      } else if (error) {
        window.opener.postMessage(
          { type: 'oauth-callback', error: error, errorDescription: errorDesc || error },
          window.location.origin
        );
      } else {
        window.opener.postMessage(
          { type: 'oauth-callback', error: 'Aucun code de validation reçu.' },
          window.location.origin
        );
      }

      setTimeout(function() { window.close(); }, 200);
    })();
  </script>
</body>
</html>
